manual_seed: 1234

weight: null

#warmup_lr: true
#warmup_iters: 0.1
use_amp: true
data_spec:
  mode: image
  num_samples: 10
  eval_samples: 10
  window_size: 5
  prefetch_factor: 8  # prefetch_factor for dataloader (default: 2)
  train_size: 256
  eval_size: 256
  aug:
    flip:
      p: 0.5
  normalize:
    std: [ 0.5, 0.5, 0.5 ]
    mean: [ 0.5, 0.5, 0.5 ]

video_spec:
  bottom_half: false
  fps: 25
  size: [ 256, 256 ]

audio_spec:
  mel_step_size: 16
  sample_rate: 16000

model:
  type: lip_mage_vit_base
  vq_config_path: config/vqgan.yml
  use_audio_reference: false
  use_image_reference: false
  mage_pretrain_ckpt_path: pretrained/lip_mage_vit_base_pretrained.pt
  vq_state_dict: pretrained/vq_model_512_256.pt


optim:
  type: Adam
  lr: !!float 1.5e-4  # adjust by effective bsz as mage
  weight_decay: 0.05
  betas: [ 0.9, 0.999 ]

scheduler:
 type: MultiStepLR
 milestones: [ 1 ]
 gamma: 1

#scheduler:
#  type: PolynomialLR
#  power: 0.9

# scheduler:
#   type: CosineAnnealingLR
#   eta_min: 1.0e-5


losses:
  sync_loss:
    type: CosineLoss
    loss_weight: 1