manual_seed: 1234

weight: ~

warmup_lr: true
warmup_iters: 0.1
data_spec:
  mode: tar
  num_samples: 1000
  eval_samples: 10
  window_size: 5
  prefetch_factor: 8  # prefetch_factor for dataloader (default: 2)
  train_size: 256
  eval_size: 256
  aug:
    flip:
      p: 0.5
  normalize:
    std: [ 0.5, 0.5, 0.5 ]
    mean: [ 0.5, 0.5, 0.5 ]


video_spec:
  bottom_half: false
  fps: 25
  size: [ 256, 256 ]

audio_spec:
  mel_step_size: 16
  sample_rate: 16000

optim:
  type: Adam
  lr: 1.0e-5
  betas: [ 0.9, 0.999 ]

scheduler:
  type: MultiStepLR
  milestones: [ 0.4, 0.8 ]
  gamma: 0.5

#scheduler:
#  type: CosineAnnealingLR
#  eta_min: 1.0e-5


losses:
  sync_loss:
    type: CosineLoss
    loss_weight: 1
