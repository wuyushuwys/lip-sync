video_spec:
  fps: 25
  size: [192, 192]

audio_spec:
  mel_step_size: 16
  sample_rate: 16000

window_size: 5

num_samples: 1000
eval_samples: 50

optim:
  type: Adam
  lr: 1.0e-5
  betas: [0.9, 0.999]

#scheduler:
#  type: MultiStepLR
#  milestones: [0.4, 0.8]
#  gamma: 0.1

scheduler:
  type: CosineAnnealingLR
  eta_min: 1.0e-5


losses:
  sync_loss:
    type: CosineLoss
    loss_weight: 1
