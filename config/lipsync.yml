manual_seed: 1234

data_mode: 'image'

video_spec:
  fps: 25
  size: [ 256, 256 ]
  crop_pad: [ 50, 50, -50, -50 ]

audio_spec:
  mel_step_size: 16
  sample_rate: 16000

window_size: 5

num_samples: 500
eval_samples: 50

optim:
  type: Adam
  lr: 1.0e-5
  betas: [ 0.9, 0.999 ]

#scheduler:
#  type: MultiStepLR
#  milestones: [0.8]
#  gamma: 0.5

scheduler:
  type: CosineAnnealingLR
  eta_min: 1.0e-7


losses:
  recon_loss:
    type: PixelLoss
    criterion: mse
    loss_weight: 0.1
  #  perceptual_loss:
  #    type: LPIPSLoss
  #    loss_weight: 1
  #    lpips_loss_arch: 'alex'
  perceptual_loss:
    type: PerceptualLoss
    layer_weights: { '2': 0.1, '7': 0.1, '16': 1, '25': 1, '34': 1, }
    vgg_type: 'vgg19'
    norm_img: False
    criterion: 'l1'
    perceptual_weight: 1

  sync_loss:
    type: SyncLoss
    ckpt_path: runs/train_syncnet_hdtf_ori_expert/weights/syncnet.pt
    loss_weight: 0
