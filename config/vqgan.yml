manual_seed: 1234
g_weight: null
d_weight: null
#ckpt: runs/train_vqgan_ffhq_femasr/ckpt/latest.pt
#warmup_lr: true
#warmup_iters: 100
gan_starts: 0
clip_grad: 5
data_spec:
  max_datasize: 100000
  prefetch_factor: 8  # prefetch_factor for dataloader (default: 2)
  num_eval: 200
  train_size: 256
  eval_size: 256
  aug:
    use_orig: false  # using original resolution ( false will resize to 2*train_size, true will crop 2*train_size)
    use_flip: true
    use_rot: true
    use_random_size: true
    #    normalize:
    #      std: [ 0.5, 0.5, 0.5 ]
    #      mean: [ 0.5, 0.5, 0.5 ]

#g_model:
#  img_size: 256
#  nf: 64
#  ch_mult: [ 1, 2, 2, 4, 4, 8 ]
#  quantizer: nearest
#  codebook_size: 1024
#  image_norm: false

#d_model:
#  nc: 3
#  ndf: 64
#  n_layers: 4

g_model:
  gt_resolution: 256
  norm_type: 'gn'
  act_type: 'silu'
  codebook_params: # has to order from low to high
    - [ 32, 512, 256 ]

d_model:
  num_in_ch: 3

optim:
  - type: Adam
    lr: !!float 1e-4
    betas: [ 0.9, 0.999 ]
  - type: Adam
    lr: !!float 4e-4
    betas: [ 0.9, 0.999 ]

scheduler:
  type: MultiStepLR
  milestones: [ 1 ]
  gamma: 1

#scheduler:
#  type: PolynomialLR
#  power: 0.9

#scheduler:
#  type: CosineAnnealingLR
#  eta_min: 1.0e-7


losses:
  recon_loss:
    type: PixelLoss
    criterion: l1
    loss_weight: 1
  perceptual_loss:
    type: LPIPSLoss
    loss_weight: 1
    lpips_loss_arch: 'vgg'
  #  perceptual_loss:
  #    type: PerceptualLoss
  #    layer_weights: { '2': 0.1, '7': 0.1, '16': 1, '25': 1, '34': 1, }
  #    vgg_type: 'vgg19'
  #    norm_img: False
  #    criterion: 'l1'
  #    perceptual_weight: 1

  codebook_loss:
    loss_weight: 1

  semantic_loss:
    loss_weight: 0.1

  adversarial:
    type: GANLoss
    gan_type: hinge
    loss_weight: 0.1  # using adaptive loss_weight
